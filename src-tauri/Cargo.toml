[package]
name = "ustad"
version = "0.1.0"
edition = "2021"

[lib]
name = "ustad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No plugins on purpose: no http, no updater, no shell. The app never goes online.
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
